<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Visor Satelital KMZ Multi-Región - Zafra</title>
    
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <style>
        * { box-sizing: border-box; }
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            width: 100%;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
            overflow: hidden;
        }
        #map {
            height: 100vh;
            width: 100vw;
            background: #1a1a1a;
        }
        
        /* Panel de control móvil */
        .panel-control {
            position: absolute;
            top: 12px;
            right: 12px;
            z-index: 1000;
            background: rgba(255, 255, 255, 0.96);
            border-radius: 10px;
            box-shadow: 0 4px 16px rgba(0,0,0,0.4);
            width: 335px;
            max-width: calc(100vw - 24px);
            overflow: hidden;
        }
        .panel-header {
            background: #1b5e20;
            color: white;
            padding: 11px 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            user-select: none;
        }
        .panel-header h3 {
            margin: 0;
            font-size: 14px;
            font-weight: 600;
        }
        .panel-body {
            padding: 12px 14px;
            max-height: 82vh;
            overflow-y: auto;
        }
        .panel-body.oculto {
            display: none;
        }
        .seccion {
            margin-bottom: 12px;
            padding-bottom: 10px;
            border-bottom: 1px solid #e0e0e0;
        }
        .seccion:last-child {
            border-bottom: none;
            margin-bottom: 0;
            padding-bottom: 0;
        }
        label {
            font-size: 12px;
            font-weight: 700;
            color: #2c3e50;
            display: block;
            margin-bottom: 5px;
        }
        .buscador-box {
            display: flex;
            gap: 6px;
            position: relative;
        }
        input[type="text"] {
            flex: 1;
            padding: 8px 10px;
            border: 1px solid #bbb;
            border-radius: 6px;
            font-size: 13px;
            outline: none;
            width: 100%;
        }
        input[type="text"]:focus {
            border-color: #2e7d32;
        }
        input[type="file"] {
            width: 100%;
            font-size: 11px;
            background: #f4f6f8;
            padding: 6px;
            border-radius: 6px;
            border: 1px dashed #999;
            margin-top: 5px;
        }
        input[type="range"] {
            width: 100%;
            accent-color: #2e7d32;
        }
        .btn {
            padding: 7px 11px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
            font-weight: 600;
            transition: background 0.2s;
        }
        .btn-verde { background-color: #2e7d32; color: white; }
        .btn-verde:hover { background-color: #1b5e20; }
        .btn-azul { background-color: #1565c0; color: white; }
        .btn-azul:hover { background-color: #0d47a1; }
        .btn-rojo { background-color: #c62828; color: white; }
        .btn-rojo:hover { background-color: #8e0000; }
        .btn-gris { background-color: #455a64; color: white; width: 100%; }
        .btn-gris:hover { background-color: #263238; }
        .btn-mini {
            padding: 4px 7px;
            font-size: 11px;
            border-radius: 4px;
        }

        /* Lista de Regiones y Sub-lista de Lotes */
        .lista-regiones {
            max-height: 200px;
            overflow-y: auto;
            border: 1px solid #ddd;
            border-radius: 6px;
            background: #fafafa;
            margin-top: 6px;
        }
        .item-region-container {
            border-bottom: 1px solid #eee;
        }
        .item-region-container:last-child { border-bottom: none; }
        .item-region {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 7px 8px;
            font-size: 12px;
            background: #fff;
        }
        .item-region-info {
            display: flex;
            align-items: center;
            gap: 6px;
            flex: 1;
            overflow: hidden;
        }
        .item-region-nombre {
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            font-weight: 600;
            color: #333;
            cursor: pointer;
        }
        .item-region-acciones {
            display: flex;
            gap: 4px;
            margin-left: 6px;
        }
        
        /* Acordeón de lotes por región */
        .sublista-lotes {
            display: none;
            background: #f1f8f5;
            padding: 6px 8px;
            max-height: 140px;
            overflow-y: auto;
            border-top: 1px dashed #d0e8df;
        }
        .sublista-lotes.activo {
            display: block;
        }
        .lote-item-btn {
            display: block;
            width: 100%;
            text-align: left;
            background: white;
            border: 1px solid #c8e6c9;
            padding: 4px 8px;
            margin-bottom: 3px;
            font-size: 11px;
            border-radius: 4px;
            cursor: pointer;
            color: #1b5e20;
            font-weight: 500;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .lote-item-btn:hover {
            background: #2e7d32;
            color: white;
        }

        /* Sugerencias de búsqueda general */
        .sugerencias-lista {
            position: absolute;
            top: 100%;
            left: 0;
            right: 45px;
            background: white;
            border: 1px solid #ccc;
            border-top: none;
            border-radius: 0 0 6px 6px;
            max-height: 160px;
            overflow-y: auto;
            z-index: 1100;
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
            display: none;
        }
        .sugerencia-item {
            padding: 7px 10px;
            font-size: 12px;
            cursor: pointer;
            border-bottom: 1px solid #f0f0f0;
        }
        .sugerencia-item:hover {
            background: #e8f5e9;
            color: #1b5e20;
            font-weight: bold;
        }

        .estado-msg {
            font-size: 11px;
            margin-top: 6px;
            padding: 6px 8px;
            border-radius: 4px;
            background: #e8f5e9;
            color: #1b5e20;
            display: none;
        }
        .estado-error {
            background: #ffebee;
            color: #c62828;
        }
        .fila-flex {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 11px;
            color: #555;
        }
        .grid-botones {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 6px;
            margin-top: 6px;
        }
        .leaflet-popup-content {
            font-size: 12px;
            line-height: 1.4;
            max-height: 240px;
            overflow-y: auto;
        }
        .tabla-datos {
            width: 100%;
            border-collapse: collapse;
            margin-top: 5px;
            font-size: 11px;
        }
        .tabla-datos td {
            border-bottom: 1px solid #eee;
            padding: 3px 4px;
        }
        .tabla-datos td:first-child {
            font-weight: bold;
            color: #444;
        }
    </style>
</head>
<body>

    <div id="map"></div>

    <div class="panel-control">
        <div class="panel-header" onclick="togglePanel()">
            <h3>Control de Fincas KMZ - Satélite</h3>
            <span id="icono-toggle">▼</span>
        </div>
        
        <div class="panel-body" id="panelBody">
            <!-- 1. Buscador General de Finca / Lote -->
            <div class="seccion">
                <label for="inputFinca">1. Buscar Lote (ej. 10-01-01):</label>
                <div class="buscador-box">
                    <input type="text" id="inputFinca" placeholder="Ej: 10-01-01" autocomplete="off"
                           oninput="mostrarSugerencias()"
                           onkeyup="if(event.key==='Enter') buscarFinca()">
                    <button class="btn btn-verde" onclick="buscarFinca()">Ir</button>
                    <div id="listaSugerencias" class="sugerencias-lista"></div>
                </div>
                <div id="statusBusqueda" class="estado-msg"></div>
            </div>

            <!-- 2. Gestor de Regiones y Listado de Lotes -->
            <div class="seccion">
                <div class="fila-flex" style="margin-bottom: 4px;">
                    <label style="margin:0;">2. Regiones y Listado de Lotes:</label>
                    <button class="btn btn-azul btn-mini" onclick="activarTodasRegiones()">Ver Todos</button>
                </div>
                
                <div class="lista-regiones" id="listaRegiones">
                    <div class="sin-regiones">No hay mapas KMZ guardados aún.</div>
                </div>
            </div>

            <!-- 3. Agregar Nuevo KMZ -->
            <div class="seccion">
                <label for="nombreRegionInput">3. Agregar Nuevo KMZ / Región:</label>
                <input type="text" id="nombreRegionInput" placeholder="Nombre de región (ej. Zona Sur) - Opcional">
                <input type="file" id="inputKmz" accept=".kmz,.kml,application/vnd.google-earth.kmz,application/vnd.google-earth.kml+xml">
                <div id="statusKmz" class="estado-msg"></div>
            </div>

            <!-- 4. Opacidad / Transparencia -->
            <div class="seccion">
                <div class="fila-flex">
                    <label for="opacidad" style="margin:0;">Opacidad de Capas:</label>
                    <span id="valOpacidad">75%</span>
                </div>
                <input type="range" id="opacidad" min="0" max="1" step="0.05" value="0.75">
            </div>

            <!-- 5. Navegación -->
            <div class="grid-botones">
                <button class="btn btn-gris" onclick="centrarTodosActivos()">Centrar Todo</button>
                <button class="btn btn-gris" id="btnQuitarResaltado" onclick="limpiarSeleccion()">Quitar Pin</button>
            </div>
        </div>
    </div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <!-- JSZip -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <!-- toGeoJSON -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/togeojson/0.16.0/togeojson.min.js"></script>

    <script>
        const centroDefault = [14.03534, -91.05743];

        const map = L.map('map').setView(centroDefault, 12);

        const satelite = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
            attribution: 'Esri, Maxar, Earthstar Geographics',
            maxZoom: 19
        }).addTo(map);

        const etiquetas = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Reference/World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}', {
            maxZoom: 19
        }).addTo(map);

        L.control.layers({ "Satélite": satelite }, { "Nombres / Carreteras": etiquetas }, { position: 'topleft' }).addTo(map);

        const DB_NAME = 'VisorFincasKMZ_DB_v3';
        const STORE_NAME = 'regiones_kmz';
        let db = null;

        let mapasCargados = {};
        let fincaResaltada = null;
        let marcadorFinca = null;

        const paletaColores = ['#00e676', '#00b0ff', '#ffea00', '#ff9100', '#ea80fc', '#1de9b6'];

        function iniciarDB() {
            return new Promise((resolve, reject) => {
                const request = indexedDB.open(DB_NAME, 1);
                request.onupgradeneeded = function(e) {
                    const database = e.target.result;
                    if (!database.objectStoreNames.contains(STORE_NAME)) {
                        database.createObjectStore(STORE_NAME, { keyPath: 'id' });
                    }
                };
                request.onsuccess = function(e) {
                    db = e.target.result;
                    resolve(db);
                };
                request.onerror = () => reject('Error abriendo base de datos local.');
            });
        }

        function guardarEnDB(registro) {
            return new Promise((resolve, reject) => {
                const tx = db.transaction(STORE_NAME, 'readwrite');
                const store = tx.objectStore(STORE_NAME);
                store.put(registro);
                tx.oncomplete = () => resolve();
                tx.onerror = () => reject('No se pudo guardar en memoria local.');
            });
        }

        function obtenerTodosDeDB() {
            return new Promise((resolve, reject) => {
                const tx = db.transaction(STORE_NAME, 'readonly');
                const store = tx.objectStore(STORE_NAME);
                const req = store.getAll();
                req.onsuccess = () => resolve(req.result || []);
                req.onerror = () => reject('Error leyendo mapas guardados.');
            });
        }

        function eliminarDeDB(id) {
            return new Promise((resolve, reject) => {
                const tx = db.transaction(STORE_NAME, 'readwrite');
                const store = tx.objectStore(STORE_NAME);
                store.delete(id);
                tx.oncomplete = () => resolve();
                tx.onerror = () => reject('Error al eliminar.');
            });
        }

        window.addEventListener('DOMContentLoaded', async () => {
            try {
                await iniciarDB();
                const guardados = await obtenerTodosDeDB();
                if (guardados.length > 0) {
                    for (let i = 0; i < guardados.length; i++) {
                        await procesarYMontarArchivo(guardados[i], i, false);
                    }
                    actualizarListaUI();
                    centrarTodosActivos();
                }
            } catch (err) {
                console.error(err);
            }
        });

        function extraerDatosExtendidosKML(kmlDom) {
            const placemarks = Array.from(kmlDom.getElementsByTagName('*')).filter(el => el.localName === 'Placemark');
            return placemarks.map(pm => {
                const datos = {};
                let codigoDetectado = '';

                const nameEl = Array.from(pm.children).find(c => c.localName === 'name');
                const nombreRaw = nameEl ? nameEl.textContent.trim() : '';

                const simpleDatas = Array.from(pm.getElementsByTagName('*')).filter(el => el.localName === 'SimpleData');
                simpleDatas.forEach(sd => {
                    const key = sd.getAttribute('name') || 'Dato';
                    const val = sd.textContent.trim();
                    if (val) {
                        datos[key] = val;
                        if (/^\d{1,4}-\d{1,3}-\d{1,3}/.test(val) && !codigoDetectado) {
                            codigoDetectado = val;
                        }
                    }
                });

                const datas = Array.from(pm.getElementsByTagName('*')).filter(el => el.localName === 'Data');
                datas.forEach(d => {
                    const key = d.getAttribute('name') || 'Dato';
                    const valEl = Array.from(d.children).find(c => c.localName === 'value');
                    const val = valEl ? valEl.textContent.trim() : '';
                    if (val) {
                        datos[key] = val;
                        if (/^\d{1,4}-\d{1,3}-\d{1,3}/.test(val) && !codigoDetectado) {
                            codigoDetectado = val;
                        }
                    }
                });

                const descEl = Array.from(pm.children).find(c => c.localName === 'description');
                const descRaw = descEl ? descEl.textContent.trim() : '';
                const descTexto = descRaw.replace(/<[^>]*>?/gm, ' ').replace(/\s+/g, ' ').trim();

                if (!codigoDetectado && descTexto) {
                    const matchLote = descTexto.match(/\b\d{1,4}-\d{1,3}-\d{1,3}\b/);
                    if (matchLote) codigoDetectado = matchLote[0];
                }

                const tituloFinal = codigoDetectado || nombreRaw || Object.values(datos)[0] || 'Lote sin código';
                const todosValores = [nombreRaw, codigoDetectado, descTexto, ...Object.values(datos)].join(' ');

                return {
                    titulo: tituloFinal,
                    nombreOriginal: nombreRaw,
                    atributos: datos,
                    descripcionHtml: descRaw,
                    textoIndexado: todosValores.toLowerCase(),
                    textoSinGuiones: todosValores.toLowerCase().replace(/[-\s]/g, '')
                };
            });
        }

        document.getElementById('inputKmz').addEventListener('change', async function(e) {
            const archivo = e.target.files[0];
            if (!archivo) return;

            mostrarMensaje('statusKmz', 'Leyendo lotes y guardando región...', false);

            try {
                const arrayBuffer = await archivo.arrayBuffer();
                const nombrePersonalizado = document.getElementById('nombreRegionInput').value.trim();
                const nombreFinal = nombrePersonalizado || archivo.name.replace(/\.(kmz|kml)$/i, '');

                const nuevoRegistro = {
                    id: 'reg_' + Date.now(),
                    nombre: nombreFinal,
                    fileName: archivo.name,
                    buffer: arrayBuffer,
                    visible: true
                };

                const indiceColor = Object.keys(mapasCargados).length;
                await procesarYMontarArchivo(nuevoRegistro, indiceColor, true);
                await guardarEnDB(nuevoRegistro);

                actualizarListaUI();
                document.getElementById('inputKmz').value = '';
                document.getElementById('nombreRegionInput').value = '';

                const cantLotes = mapasCargados[nuevoRegistro.id].fincas.length;
                mostrarMensaje('statusKmz', `Región "${nombreFinal}" guardada (${cantLotes} lotes leídos).`, false);

            } catch (err) {
                console.error(err);
                mostrarMensaje('statusKmz', 'Error: ' + err.message, true);
            }
        });

        async function procesarYMontarArchivo(registro, indiceColor, hacerZoom) {
            let kmlTexto = '';
            let zip = null;
            const esKmz = registro.fileName.toLowerCase().endsWith('.kmz');

            if (esKmz) {
                zip = await JSZip.loadAsync(registro.buffer);
                const kmlFiles = Object.values(zip.files).filter(f => f.name.toLowerCase().endsWith('.kml'));
                if (kmlFiles.length === 0) throw new Error('No se encontró KML dentro del KMZ.');
                
                kmlFiles.sort((a, b) => a.name.includes('doc.kml') ? -1 : 1);
                kmlTexto = await kmlFiles[0].async('text');
            } else {
                const decoder = new TextDecoder('utf-8');
                kmlTexto = decoder.decode(registro.buffer);
            }

            const parser = new DOMParser();
            const kmlDom = parser.parseFromString(kmlTexto, 'text/xml');

            const metadatosPlacemarks = extraerDatosExtendidosKML(kmlDom);
            let indicePlacemark = 0;

            const geoJsonData = toGeoJSON.kml(kmlDom);
            const tieneVectores = geoJsonData && geoJsonData.features && geoJsonData.features.length > 0;
            const groundOverlays = Array.from(kmlDom.getElementsByTagName('*')).filter(el => el.localName === 'GroundOverlay');

            const colorRegion = paletaColores[indiceColor % paletaColores.length];
            const opacidadActual = parseFloat(document.getElementById('opacidad').value);

            let layerPrincipal = null;
            let bounds = null;
            let fincasRegion = [];

            if (tieneVectores) {
                layerPrincipal = L.geoJSON(geoJsonData, {
                    style: function(feature) {
                        const stroke = (feature.properties && feature.properties.stroke) ? feature.properties.stroke : colorRegion;
                        const fill = (feature.properties && feature.properties.fill) ? feature.properties.fill : colorRegion;
                        return {
                            color: stroke,
                            weight: 2,
                            opacity: 0.95,
                            fillColor: fill,
                            fillOpacity: opacidadActual * 0.55
                        };
                    },
                    pointToLayer: function(feature, latlng) {
                        return L.circleMarker(latlng, {
                            radius: 6,
                            fillColor: colorRegion,
                            color: '#111',
                            weight: 1.5,
                            fillOpacity: 0.9
                        });
                    },
                    onEachFeature: function(feature, layer) {
                        const props = feature.properties || {};
                        const meta = metadatosPlacemarks[indicePlacemark] || null;
                        indicePlacemark++;

                        const titulo = (meta && meta.titulo !== 'Lote sin código') ? meta.titulo : (props.name || 'Sin código');
                        
                        let tablaHtml = '';
                        const claves = meta ? Object.keys(meta.atributos) : [];
                        if (claves.length > 0) {
                            tablaHtml = '<table class="tabla-datos">';
                            claves.forEach(k => {
                                tablaHtml += `<tr><td>${k}:</td><td>${meta.atributos[k]}</td></tr>`;
                            });
                            tablaHtml += '</table>';
                        } else if (props.description) {
                            tablaHtml = `<div style="margin-top:4px;">${props.description}</div>`;
                        }

                        let popupHtml = `<div style="font-size:10px; color:#666;">Región: ${registro.nombre}</div>`;
                        popupHtml += `<b style="color:#1b5e20; font-size:14px;">Lote: ${titulo}</b>`;
                        popupHtml += tablaHtml;
                        layer.bindPopup(popupHtml);

                        const propsValues = Object.values(props).filter(v => typeof v === 'string' || typeof v === 'number').join(' ');
                        const textoCompleto = `${titulo} ${propsValues} ${meta ? meta.textoIndexado : ''}`.toLowerCase();
                        const textoLimpio = textoCompleto.replace(/[-\s]/g, '');

                        fincasRegion.push({
                            regionId: registro.id,
                            regionNombre: registro.nombre,
                            nombre: String(titulo),
                            textoBusqueda: textoCompleto,
                            textoSinGuiones: textoLimpio,
                            layer: layer
                        });
                    }
                });

                if (layerPrincipal.getBounds().isValid()) {
                    bounds = layerPrincipal.getBounds();
                }

            } else if (groundOverlays.length > 0 && zip) {
                const grupoOverlays = L.featureGroup();
                let latMin = 90, latMax = -90, lngMin = 180, lngMax = -180;

                for (const go of groundOverlays) {
                    const hrefEl = go.getElementsByTagName('href')[0] || Array.from(go.getElementsByTagName('*')).find(el => el.localName === 'href');
                    const latLonBoxEl = go.getElementsByTagName('LatLonBox')[0] || Array.from(go.getElementsByTagName('*')).find(el => el.localName === 'LatLonBox');
                    const nameEl = go.getElementsByTagName('name')[0];

                    if (hrefEl && latLonBoxEl) {
                        const imgPath = hrefEl.textContent.trim();
                        const north = parseFloat(latLonBoxEl.getElementsByTagName('north')[0]?.textContent);
                        const south = parseFloat(latLonBoxEl.getElementsByTagName('south')[0]?.textContent);
                        const east = parseFloat(latLonBoxEl.getElementsByTagName('east')[0]?.textContent);
                        const west = parseFloat(latLonBoxEl.getElementsByTagName('west')[0]?.textContent);

                        const archivoImg = Object.values(zip.files).find(f => f.name.toLowerCase().includes(imgPath.toLowerCase()));
                        if (archivoImg) {
                            const imgBlob = await archivoImg.async('blob');
                            const imgUrl = URL.createObjectURL(imgBlob);
                            const imgBounds = [[south, west], [north, east]];

                            const overlay = L.imageOverlay(imgUrl, imgBounds, { opacity: opacidadActual });
                            overlay.addTo(grupoOverlays);

                            if (south < latMin) latMin = south;
                            if (north > latMax) latMax = north;
                            if (west < lngMin) lngMin = west;
                            if (east > lngMax) lngMax = east;

                            const nombreOverlay = nameEl ? nameEl.textContent.trim() : registro.nombre;
                            fincasRegion.push({
                                regionId: registro.id,
                                regionNombre: registro.nombre,
                                nombre: nombreOverlay,
                                textoBusqueda: nombreOverlay.toLowerCase(),
                                textoSinGuiones: nombreOverlay.toLowerCase().replace(/[-\s]/g, ''),
                                bounds: L.latLngBounds(imgBounds)
                            });
                        }
                    }
                }

                if (grupoOverlays.getLayers().length > 0) {
                    layerPrincipal = grupoOverlays;
                    bounds = L.latLngBounds([[latMin, lngMin], [latMax, lngMax]]);
                } else {
                    throw new Error('No se encontraron imágenes válidas dentro del GroundOverlay.');
                }
            } else {
                throw new Error('El archivo no contiene polígonos ni imágenes georreferenciadas válidas.');
            }

            if (registro.visible && layerPrincipal) {
                layerPrincipal.addTo(map);
            }

            mapasCargados[registro.id] = {
                id: registro.id,
                nombre: registro.nombre,
                color: colorRegion,
                visible: registro.visible,
                layer: layerPrincipal,
                bounds: bounds,
                fincas: fincasRegion,
                esVectorial: tieneVectores
            };

            if (hacerZoom && bounds && bounds.isValid()) {
                map.fitBounds(bounds, { padding: [25, 25] });
            }
        }

        // ==========================================
        // GESTIÓN DE REGIONES Y LISTADO DESPLEGABLE
        // ==========================================
        function actualizarListaUI() {
            const contenedor = document.getElementById('listaRegiones');
            const ids = Object.keys(mapasCargados);

            if (ids.length === 0) {
                contenedor.innerHTML = '<div class="sin-regiones">No hay mapas KMZ guardados aún.</div>';
                return;
            }

            contenedor.innerHTML = '';
            ids.forEach(id => {
                const reg = mapasCargados[id];
                const contenedorItem = document.createElement('div');
                contenedorItem.className = 'item-region-container';

                // Generar lista de botones de lotes internos ordenados alfabéticamente
                let lotesHtml = '';
                if (reg.fincas && reg.fincas.length > 0) {
                    const fincasOrdenadas = [...reg.fincas].sort((a, b) => a.nombre.localeCompare(b.nombre, undefined, {numeric: true}));
                    fincasOrdenadas.forEach(f => {
                        // Escapar comillas para seguridad en el evento click inline
                        const nombreSeguro = f.nombre.replace(/'/g, "\\'");
                        lotesHtml += `<button class="lote-item-btn" onclick="seleccionarLotePorRegion('${reg.id}', '${nombreSeguro}')">${f.nombre}</button>`;
                    });
                } else {
                    lotesHtml = `<div style="font-size:11px; color:#777; padding:4px;">No hay lotes vectoriales individuales.</div>`;
                }

                contenedorItem.innerHTML = `
                    <div class="item-region">
                        <div class="item-region-info">
                            <input type="checkbox" ${reg.visible ? 'checked' : ''} onchange="toggleRegion('${id}', this.checked)">
                            <span style="display:inline-block; width:10px; height:10px; border-radius:50%; background:${reg.color}; flex-shrink:0;"></span>
                            <span class="item-region-nombre" title="${reg.nombre}" onclick="enfocarRegion('${id}')">
                                ${reg.nombre} <small style="color:#777;">(${reg.fincas.length})</small>
                            </span>
                        </div>
                        <div class="item-region-acciones">
                            <button class="btn btn-verde btn-mini" title="Ver listado de lotes" onclick="toggleSublista('${id}')">Lotes</button>
                            <button class="btn btn-gris btn-mini" title="Enfocar región" onclick="enfocarRegion('${id}')">Ver</button>
                            <button class="btn btn-rojo btn-mini" title="Eliminar" onclick="borrarRegion('${id}')">X</button>
                        </div>
                    </div>
                    <div class="sublista-lotes" id="sublotes_${id}">
                        ${lotesHtml}
                    </div>
                `;
                contenedor.appendChild(contenedorItem);
            });
        }

        function toggleSublista(id) {
            const sub = document.getElementById(`sublotes_${id}`);
            if (sub) {
                sub.classList.toggle('activo');
            }
        }

        function seleccionarLotePorRegion(regionId, nombreLote) {
            const reg = mapasCargados[regionId];
            if (!reg) return;
            const fincaObj = reg.fincas.find(f => f.nombre === nombreLote);
            if (fincaObj) {
                irAFinca(fincaObj);
            }
        }

        async function toggleRegion(id, estado) {
            const reg = mapasCargados[id];
            if (!reg) return;
            reg.visible = estado;

            if (estado) {
                if (reg.layer) reg.layer.addTo(map);
            } else {
                if (reg.layer) map.removeLayer(reg.layer);
            }

            const todos = await obtenerTodosDeDB();
            const doc = todos.find(d => d.id === id);
            if (doc) {
                doc.visible = estado;
                await guardarEnDB(doc);
            }
        }

        async function activarTodasRegiones() {
            const ids = Object.keys(mapasCargados);
            for (const id of ids) {
                if (!mapasCargados[id].visible) {
                    await toggleRegion(id, true);
                }
            }
            actualizarListaUI();
            centrarTodosActivos();
        }

        function enfocarRegion(id) {
            const reg = mapasCargados[id];
            if (!reg) return;
            if (!reg.visible) {
                toggleRegion(id, true);
                actualizarListaUI();
            }
            if (reg.bounds && reg.bounds.isValid()) {
                map.fitBounds(reg.bounds, { padding: [25, 25] });
            }
        }

        async function borrarRegion(id) {
            const reg = mapasCargados[id];
            if (!reg) return;
            if (reg.layer) map.removeLayer(reg.layer);
            delete mapasCargados[id];
            await eliminarDeDB(id);
            limpiarSeleccion();
            actualizarListaUI();
        }

        function centrarTodosActivos() {
            const grupoBounds = L.latLngBounds();
            let hayVisibles = false;

            Object.values(mapasCargados).forEach(reg => {
                if (reg.visible && reg.bounds && reg.bounds.isValid()) {
                    grupoBounds.extend(reg.bounds);
                    hayVisibles = true;
                }
            });

            if (hayVisibles && grupoBounds.isValid()) {
                map.fitBounds(grupoBounds, { padding: [25, 25] });
            } else {
                map.flyTo(centroDefault, 12, { duration: 1.0 });
            }
        }

        // ==========================================
        // BUSCADOR GENERAL DE LOTES
        // ==========================================
        function obtenerTodasFincasDisponibles() {
            let todas = [];
            Object.values(mapasCargados).forEach(reg => {
                todas = todas.concat(reg.fincas);
            });
            return todas;
        }

        function mostrarSugerencias() {
            const query = document.getElementById('inputFinca').value.trim().toLowerCase();
            const queryLimpia = query.replace(/[-\s]/g, '');
            const contenedor = document.getElementById('listaSugerencias');

            if (query.length < 2) {
                contenedor.style.display = 'none';
                return;
            }

            const todas = obtenerTodasFincasDisponibles();
            const coincidencias = todas.filter(f => 
                f.textoBusqueda.includes(query) || f.textoSinGuiones.includes(queryLimpia)
            ).slice(0, 10);

            if (coincidencias.length === 0) {
                contenedor.style.display = 'none';
                return;
            }

            contenedor.innerHTML = '';
            coincidencias.forEach(item => {
                const div = document.createElement('div');
                div.className = 'sugerencia-item';
                div.innerHTML = `${item.nombre} <span style="font-size:10px; color:#666;">(${item.regionNombre})</span>`;
                div.onclick = () => {
                    document.getElementById('inputFinca').value = item.nombre;
                    contenedor.style.display = 'none';
                    irAFinca(item);
                };
                contenedor.appendChild(div);
            });

            contenedor.style.display = 'block';
        }

        function buscarFinca() {
            document.getElementById('listaSugerencias').style.display = 'none';
            const query = document.getElementById('inputFinca').value.trim().toLowerCase();
            const queryLimpia = query.replace(/[-\s]/g, '');
            if (!query) return;

            const todas = obtenerTodasFincasDisponibles();
            if (todas.length === 0) {
                mostrarMensaje('statusBusqueda', 'No hay lotes cargados para buscar.', true);
                return;
            }

            const encontrado = todas.find(f => f.nombre.toLowerCase() === query) ||
                               todas.find(f => f.nombre.toLowerCase().replace(/[-\s]/g, '') === queryLimpia) ||
                               todas.find(f => f.nombre.toLowerCase().startsWith(query)) ||
                               todas.find(f => f.textoBusqueda.includes(query) || f.textoSinGuiones.includes(queryLimpia));

            if (encontrado) {
                irAFinca(encontrado);
            } else {
                mostrarMensaje('statusBusqueda', `No se encontró el lote "${query}".`, true);
            }
        }

        function irAFinca(fincaObj) {
            limpiarSeleccion();

            const reg = mapasCargados[fincaObj.regionId];
            if (reg && !reg.visible) {
                toggleRegion(fincaObj.regionId, true);
                actualizarListaUI();
            }

            const layer = fincaObj.layer;
            fincaResaltada = { layer: layer, regionId: fincaObj.regionId };

            if (layer) {
                if (layer.setStyle) {
                    layer.setStyle({ color: '#ff1744', weight: 4, fillColor: '#ffea00', fillOpacity: 0.65 });
                    if (layer.bringToFront) layer.bringToFront();
                }

                let centro;
                if (layer.getBounds) {
                    const b = layer.getBounds();
                    centro = b.getCenter();
                    map.fitBounds(b, { maxZoom: 16, padding: [45, 45] });
                } else if (layer.getLatLng) {
                    centro = layer.getLatLng();
                    map.flyTo(centro, 16, { duration: 1.0 });
                }

                if (centro) {
                    marcadorFinca = L.marker(centro).addTo(map);
                    layer.openPopup(centro);
                }
            } else if (fincaObj.bounds) {
                map.fitBounds(fincaObj.bounds, { padding: [30, 30] });
            }

            mostrarMensaje('statusBusqueda', `Ubicado: ${fincaObj.nombre} (${fincaObj.regionNombre})`, false);
        }

        function limpiarSeleccion() {
            if (fincaResaltada && fincaResaltada.layer) {
                const reg = mapasCargados[fincaResaltada.regionId];
                if (reg && reg.layer && reg.layer.resetStyle) {
                    reg.layer.resetStyle(fincaResaltada.layer);
                }
                fincaResaltada = null;
            }
            if (marcadorFinca) {
                map.removeLayer(marcadorFinca);
                marcadorFinca = null;
            }
        }

        // ==========================================
        // CONTROLES GENERALES
        // ==========================================
        document.getElementById('opacidad').addEventListener('input', function(e) {
            const val = parseFloat(e.target.value);
            document.getElementById('valOpacidad').textContent = Math.round(val * 100) + '%';

            Object.values(mapasCargados).forEach(reg => {
                if (!reg.layer) return;
                if (reg.esVectorial && reg.layer.setStyle) {
                    reg.layer.setStyle({ fillOpacity: val * 0.55 });
                } else if (reg.layer.eachLayer) {
                    reg.layer.eachLayer(l => {
                        if (l.setOpacity) l.setOpacity(val);
                    });
                }
            });
        });

        document.addEventListener('click', function(e) {
            if (!e.target.closest('.buscador-box')) {
                document.getElementById('listaSugerencias').style.display = 'none';
            }
        });

        function togglePanel() {
            const body = document.getElementById('panelBody');
            const icono = document.getElementById('icono-toggle');
            body.classList.toggle('oculto');
            icono.textContent = body.classList.contains('oculto') ? '▲' : '▼';
        }

        function mostrarMensaje(id, texto, esError) {
            const el = document.getElementById(id);
            el.textContent = texto;
            el.className = esError ? 'estado-msg estado-error' : 'estado-msg';
            el.style.display = 'block';
        }
    </script>
</body>
</html>
